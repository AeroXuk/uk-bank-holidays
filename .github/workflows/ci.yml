name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      UKBH_PG_ARGS: "-h localhost -U postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m uk_bank_holidays validate
      - run: pytest
      - name: Generated files are up to date
        run: |
          python -m uk_bank_holidays generate
          python -m uk_bank_holidays sql --dialect all
          python -m uk_bank_holidays docs
          git diff --exit-code -- data sql docs/generated
          test -z "$(git status --porcelain --untracked-files=all -- data sql docs/generated)"
